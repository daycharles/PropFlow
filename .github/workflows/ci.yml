name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'
      - run: dotnet build PropFlow.slnx --configuration Release
      - run: dotnet run --project tests/PropFlow.FoundationChecks --configuration Release --no-build
